name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Make sure jq is installed
        run: command -v jq || brew install jq || (sudo apt-get update && sudo apt-get install -y jq)
      - name: Run init.sh tests
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export TEST_BASH=/bin/bash; fi
          tests/test-init.sh
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck init.sh tests/test-init.sh addons/auto-push/auto-push.sh
